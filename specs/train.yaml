name: s3-train
seeds:
- 1
budget:
  soft_usd: 0
  hard_usd: 0
options:
  commit: async
  rounds_per_agent: 1
  max_calls_per_turn: 100000
  concurrency: 1024
roles:
  s3:
    tools:
    - post
    - read_board
    - submit
    - wait
arms:
  agg_n4:
    world:
      type: swarmlab.world.aggregation:Aggregation
    medium:
      topology:
        type: swarmlab.medium.topology:Direct
        params:
          allow_all: true
      delivery: pull
    participants:
    - type: swarmlab.participants.s3:S3Agent
      count: 4
      role: s3
      params:
        model: Qwen/Qwen3-0.6B
        base_url: http://127.0.0.1:8000
        work_tokens: 8192
